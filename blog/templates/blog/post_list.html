<!DOCTYPE html>
<html>
<head>
    <title>My Django Blog</title>
</head>
<body>
    <h1>Welcome to My Django Blog!</h1>
    <p>This is my first Django blog website.</p>

    {% for post in posts %}
        <div>
            <h2>{{ post.title }}</h2>
            <p>Published: {{ post.published_date }}</p>
            <p>{{ post.text|linebreaksbr }}</p>
        </div>
    {% empty %}
        <p>No blog posts have been published yet.</p>
    {% endfor %}
</body>
</html>
